<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>My Snowglobe</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <header class="hero">
            <h1>My Snowglobe</h1>
            <p class="tagline">Shake it for a little winter kindness!</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="snowglobe.png" alt="a snowglobe"/>
                </div>
                <button id="shake">Shake the globe!</button>
                <p class="message" id="message">Press the button and see what settles.</p>
            </section>
            <div class="snow"></div>
            <div class="snow snow2"></div>
            <div class="snow snow3"></div>
            <div class="snow snow4"></div>
            <div class="snow snow5"></div>
        </main>
        <footer>
            <p>Made by me, in the snow</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
